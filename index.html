<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,600&family=Titan+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. TEASER -->
<section class="screen dark on" id="s0"><div class="w">
  <div class="script">a little something ✦</div>
  <h1>Kuch bada aa raha hai…</h1>
  <p>Something big is coming, <span id="n0"></span></p>
  <div class="cd" id="cd"></div>
  <div class="env"><i>💗</i></div>
  <button class="btn" id="open">Open your surprise ✨</button>
  <p class="sm" id="lk"></p>
</div></section>

<!-- 2. HAPPY BIRTHDAY -->
<section class="screen grid" id="s1"><div class="bun"></div>
  <span class="up" style="left:6%;top:30%">🎈</span><span class="up" style="right:6%;top:24%;animation-delay:1s">🎈</span>
  <div class="w">
    <span class="stk" style="color:#cdeeea">Happy</span>
    <span class="stk" style="color:#ff5c7c">Birthday</span>
    <span class="pill" id="n1"></span><span class="pill" style="background:#fff;color:#3b1f2b">30 October</span>
    <div class="ring"><span class="bear">🧸</span></div>
    <button class="btn" id="b1">There’s more 💌</button>
  </div>
</section>

<!-- 3. LETTER -->
<section class="screen grid" id="s2"><div class="bun"></div><div class="w">
  <div class="card"><div class="script">To you ♥</div><div id="lt"></div></div>
  <button class="btn" id="b2">Cake time 🎂</button>
</div></section>

<!-- 4. CAKE -->
<section class="screen soft" id="s3"><div class="w">
  <div class="script" id="c1">Cake time</div>
  <h2 id="c2">Tumne kar dikhaya! 🎉</h2>
  <div class="cake" id="cake"><div class="cn"><u></u><u></u><u></u></div><div class="t t3"></div><div class="t t2"></div><div class="t t1"></div></div>
  <button class="btn" id="wish">Make a wish 🌙</button>
  <button class="btn" id="b3" hidden>One last thing 💌</button>
</div></section>

<!-- 5. QUIZ -->
<section class="screen grid" id="s4"><div class="bun"></div><div class="w">
  <div id="qa">
    <div class="script" id="qp"></div>
    <h2 id="qq"></h2>
    <div id="qo"></div>
    <div class="reply" id="qr"></div>
    <button class="btn" id="qn" hidden>Next →</button>
  </div>
  <div id="qf" hidden>
    <h2>Last mein… ✍️</h2>
    <p>Kuch kehna hai mujhse? Likh do 💗</p>
    <textarea id="fm" placeholder="Apna message yahan likho…"></textarea>
    <button class="btn" id="sd">Send to him 💌</button>
    <p class="sm" id="er"></p>
  </div>
  <div id="qd" hidden>
    <span class="bear">🧸</span>
    <h2>Thank you ❤️</h2>
    <p id="dn">Tumhare jawab pahunch gaye!</p>
  </div>
</div></section>

<script src="script.js"></script>
</body>
</html>
